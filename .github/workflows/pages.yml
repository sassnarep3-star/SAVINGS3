name: Validate savings dashboard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: python scripts/check.py
      - run: python scripts/build_site.py
      - run: python scripts/verify_site.py
      - name: Fail if generated pages are out of date
        run: |
          if ! git diff --quiet -- index.html accounts.html returns.html fdic-insurance.html \
               bonuses.html rates-competitiveness.html security-apps.html flagged.html \
               methodology.html sources.html; then
            echo "Generated HTML is stale. Run python3 scripts/build_site.py and commit the result."
            git diff --stat
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
